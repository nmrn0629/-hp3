<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, nofollow">
    <!-- ホーム画面アプリ（PWA）設定 -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#5c946e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="年調チェッカー">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <!-- Webフォント（オフライン時はシステムフォントにフォールバック） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="nencho.css?v=1.5">
</head>

<body>
    <header class="app-header">
        <div class="app-header-inner">
            <div class="app-brand">
                <span class="app-brand-mark">¥</span>
                <div>
                    <div class="app-title">年末調整 控除額チェッカー</div>

            <div class="app-header-note">入力内容は端末内でのみ計算され、送信・保存されません</div>
        </div>
    </header>

    <main class="app-main">
        <div id="nencho-app" class="nencho-app" aria-live="polite">
            <noscript>
                <p style="text-align:center;">このチェッカーの利用には JavaScript を有効にしてください。</p>

        <p class="app-version" id="app-version"></p>
    </footer>

    <script src="nencho-rules.js?v=1.5"></script>
    <script src="nencho-app.js?v=1.7"></script>
    <script>
        // サービスワーカー登録（https または localhost でのみ動作。file:// では何もしない）
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function () { /* 登録失敗時も通常表示は継続 */ });
            });
        }
    </script>
